name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install webcam and core requirements
        run: python -m pip install -r requirements-webcam.txt
      - name: Test webcam and core (headless)
        run: python -m unittest discover -s tests -v
      - name: Synthetic webcam smoke test
        run: python webcam_demo.py --simulate --max-frames 120 --no-display --save-preview simulated_dashboard.png
